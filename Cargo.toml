[package]
name = "isolf"
version = "0.1.0"
edition = "2024"
description = "Build coarse-grained iSoLF lipid membranes and vesicles for GENESIS"
license = "MIT OR Apache-2.0"
# README art / demo recording — not needed in a published crate.
exclude = ["/assets"]

[lib]
name = "isolf"
path = "src/lib.rs"

[[bin]]
name = "isolf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gif = { version = "0.13", default-features = false, features = ["raii_no_panic", "std"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rayon = "1"

# Slim, self-contained release binaries for distribution.
[profile.release]
lto = true
codegen-units = 1
strip = true
